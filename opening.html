<head>

    <!-- 커스텀 스타일 (Chess.com 다크 테마) -->
    <style>
        :root {
            --bg-main: #312e2b;
            --bg-panel: #262421;
            --bg-panel-hover: #3c3a38;
            --text-main: rgba(255, 255, 255, 0.72);
            --text-light: #ffffff;
            --accent-green: #81b64c;
            --accent-green-hover: #a3d160;
            --board-light: #ebecd0;
            --board-dark: #739552;
            --highlight-move: rgba(255, 255, 51, 0.5);
            --danger: #fa4b4b;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }

        /* Chessboard.js 오버라이드 */
        .white-1e1d7 { background-color: var(--board-light) !important; color: var(--board-dark) !important; }
        .black-3c85d { background-color: var(--board-dark) !important; color: var(--board-light) !important; }
        .highlight1-32417, .highlight2-9c5d2 { background-color: var(--highlight-move) !important; }
        .selected-square { box-shadow: inset 0 0 0 4px rgba(129,182,76,.9) !important; }
        .legal-target { position: relative; }
        .legal-target::after { content: ''; position: absolute; inset: 36%; border-radius: 50%; background: rgba(38,36,33,.48); pointer-events: none; }
        .legal-capture::after { inset: 7%; border: 4px solid rgba(38,36,33,.48); background: transparent; }
        
        /* 터치 기기에서 보드 드래그 시 스크롤 방지 */
        #board-container { touch-action: none; }

        /* Tailwind 기본 이미지 스타일과 Chessboard.js 충돌 해결 (기물 거대화 현상 방지) */
        #board-container img {
            max-width: none !important;
            margin: 0 !important;
        }
        button:focus-visible, [role="button"]:focus-visible { outline: 3px solid #a3d160; outline-offset: 2px; }
        @media (max-width: 640px) {
            #board-container { border-width: 2px; }
        }

        .btn-green {
            background-color: var(--accent-green);
            color: white;
            font-weight: 700;
            box-shadow: 0 3px 0 #537c2c;
            transition: all 0.1s;
        }
        .btn-green:hover { background-color: var(--accent-green-hover); }
        .btn-green:active { box-shadow: none; transform: translateY(3px); }
        .btn-green:disabled { background-color: #555; box-shadow: 0 3px 0 #333; color: #888; cursor: not-allowed; }

        .btn-dark {
            background-color: var(--bg-panel-hover);
            color: white;
            transition: background-color 0.1s;
        }
        .btn-dark:hover { background-color: #4c4946; }
        .btn-dark:disabled { opacity: 0.5; cursor: not-allowed; }
        .route-tile { background: linear-gradient(145deg, #3f5142, #29352d); border: 2px solid #607164; box-shadow: 0 4px 0 #18231b; transition: transform .12s, background .12s; }
        .route-tile:hover { background: linear-gradient(145deg, #59725b, #35493a); transform: translateY(-2px); }
        .route-tile:active { transform: translateY(3px); box-shadow: none; }
        .route-tile--black { background: linear-gradient(145deg, #3c3a38, #242321); border-color: #68645e; box-shadow: 0 4px 0 #151412; }

        /* 상태 뱃지 애니메이션 */
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.3s ease-out forwards; }
    </style>
</head>

              }
            },
            { id: 'l_kid_b', openingId: 'op_kid', title: '기본 피앙케토 셋업', color: 'b',
              moves: ['d4', 'Nf6', 'c4', 'g6', 'Nc3', 'Bg7', 'e4', 'd6'],
              explanations: {
                  3: { short: 'g6 폰을 올려 피앙케토를 준비합니다.', purpose: '비숍을 g7 긴 대각선에 배치할 목적입니다.' },
                  5: { short: '비숍을 g7으로 전개합니다.', purpose: '어두운 칸을 강하게 통제하는 인디언 디펜스의 상징입니다.' },
                  7: { short: 'd6로 올립니다.', purpose: 'e5 진출을 견제하고, 이후 캐슬링 후 반격할 기반을 다집니다.' }
              }
            },
            { id: 'l_e5_b', openingId: 'op_e5', title: '1...e5 기본 전개', color: 'b',
              moves: ['e4', 'e5', 'Nf3', 'Nc6', 'Bc4', 'Nf6'],
              explanations: {
                  1: { short: 'e5로 중앙을 함께 차지합니다.', purpose: 'd4와 f4를 통제하며 백의 e4 폰에 맞섭니다.' },
                  3: { short: 'Nc6로 e5 폰을 지킵니다.', purpose: '기물을 전개하면서 공격받은 중앙 폰을 보호합니다.' },
                  5: { short: 'Nf6로 e4를 압박합니다.', purpose: '전개와 공격을 함께 하되, 킹 안전을 위해 다음에는 캐슬링을 생각합니다.' }
              }
            },
            { id: 'l_scotch_w', openingId: 'op_scotch', title: '중앙을 여는 기본 수순', color: 'w',
              moves: ['e4', 'e5', 'Nf3', 'Nc6', 'd4', 'exd4', 'Nxd4'],
              explanations: {
                  4: { short: 'd4로 중앙에 도전합니다.', purpose: 'e5 폰을 압박해 중앙을 열고 기물 활동 공간을 만듭니다.' },
                  6: { short: '나이트로 되잡습니다.', purpose: '전개하면서 중앙을 회복하고 비숍의 길을 엽니다.', plan: 'Bc4 또는 Nc3를 전개하고 빠르게 캐슬링하세요.' }
              }
            }
        ];

        const STORAGE_KEY = 'opening_lab_data_v2';
        
        // 초기 설정값
        const DEFAULT_DATA = {
            version: 2,
            stats: { completedLessons: 0 },
            lessonProgress: {}, // { lessonId: { stage: 0, nextReview: 0, attempts: 0, lastScore: 0 } }
            settings: { showCoords: true, reduceAnim: false }
        };

        function loadAppData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return { ...DEFAULT_DATA, stats: {...DEFAULT_DATA.stats}, lessonProgress: {}, settings: {...DEFAULT_DATA.settings} };
                const data = JSON.parse(raw);
                if (!data || typeof data !== 'object') throw new Error('저장 형식 오류');
                return {
                    version: 2,
                    stats: { ...DEFAULT_DATA.stats, ...(data.stats || {}) },
                    lessonProgress: data.lessonProgress && typeof data.lessonProgress === 'object' ? data.lessonProgress : {},
                    settings: { ...DEFAULT_DATA.settings, ...(data.settings || {}) }
                };
            } catch (e) {
                console.error("데이터 로드 실패, 기본값 사용", e);
                return DEFAULT_DATA;
            }
        }

        function saveAppData(data) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.warn("로컬 스토리지 저장 실패 (용량 초과 또는 시크릿 모드)");
            }
        }

        let hitSynth = null;
        let clickSynth = null;
        let isAudioInit = false;

        // 체스 말 내려놓는 소리(나무 부딪히는 소리) 신시사이저 생성
        const initAudio = async () => {
            if (isAudioInit) return;
            try {
                await Tone.start();
                hitSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.01,
                    octaves: 1.5,
                    oscillator: { type: "square" },
                    envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.01 }
                }).toDestination();
                hitSynth.volume.value = -12;

                clickSynth = new Tone.NoiseSynth({
                    noise: { type: "white" },
                    envelope: { attack: 0.001, decay: 0.03, sustain: 0, release: 0.01 }
                }).toDestination();
                clickSynth.volume.value = -18;
                isAudioInit = true;
            } catch (e) {
                console.warn("오디오 초기화 실패", e);
            }
        };

        const playMoveSound = () => {
            if (!isAudioInit) {
                initAudio().then(() => {
                    if (isAudioInit) {
                        hitSynth.triggerAttackRelease("G2", "64n");
                        clickSynth.triggerAttackRelease("64n");
                    }
                });
            } else {
                hitSynth.triggerAttackRelease("G2", "64n");
                clickSynth.triggerAttackRelease("64n");
            }
        };

        // SAN 목록을 체스 엔진을 돌려 상세 정보(From/To/FEN) 객체 배열로 변환하는 헬퍼
        function buildLessonMoves(movesArray, explanations, lessonColor) {
            const chess = new Chess();
            const detailedMoves = [];
            
            for (let i = 0; i < movesArray.length; i++) {
                const sanMove = movesArray[i];
                const moveResult = chess.move(sanMove);
                if (!moveResult) {
                    console.error("Invalid PGN move in lesson data:", sanMove);
                    break;
                }
                
                const isWhite = i % 2 === 0;
                const moveColor = isWhite ? 'w' : 'b';
                
                detailedMoves.push({
                    san: sanMove,
                    from: moveResult.from,
                    to: moveResult.to,
                    color: moveColor,
                    fen: chess.fen(),
                    isOpponent: moveColor !== lessonColor,
                    explanation: explanations && explanations[i] ? explanations[i] : null
                });
            }
            return detailedMoves;
        }

        const App = () => {
            const [appData, setAppData] = useState(() => loadAppData());
            const [view, setView] = useState('dashboard'); // 'dashboard', 'list', 'lesson'
            const [activeLesson, setActiveLesson] = useState(null);
            
            // 데이터 변경 시 저장
            useEffect(() => { saveAppData(appData); }, [appData]);

            const navigate = (viewName, lesson = null) => {
                setActiveLesson(lesson);
                setView(viewName);
            };

            const updateSettings = (patch) => setAppData(prev => ({ ...prev, settings: { ...prev.settings, ...patch } }));
            const resetProgress = () => {
                if (window.confirm('모든 학습 기록과 복습 일정을 지울까요? 이 작업은 되돌릴 수 없습니다.')) {
                    setAppData({ ...DEFAULT_DATA, stats: {...DEFAULT_DATA.stats}, lessonProgress: {}, settings: {...appData.settings} });
                }
            };

            const updateLessonProgress = (lessonId, resultStats) => {
                setAppData(prev => {
                    const newData = { ...prev };
                    const currentProgress = newData.lessonProgress[lessonId] || { stage: 0, attempts: 0 };
                    
                    // 간격 반복 알고리즘
                    const isPerfect = resultStats.isPerfect; 
                    let nextStage = isPerfect ? currentProgress.stage + 1 : 1;
                    
                    let daysToAdd = 1;
                    if(nextStage === 2) daysToAdd = 3;
                    else if(nextStage === 3) daysToAdd = 7;
                    else if(nextStage === 4) daysToAdd = 14;
                    else if(nextStage >= 5) daysToAdd = 30;

                    const nextReviewDate = Date.now() + (daysToAdd * 86400000); // ms in a day
                    
                    newData.lessonProgress[lessonId] = {
                        stage: nextStage,
                        nextReview: nextReviewDate,
                        attempts: currentProgress.attempts + 1,
                        lastScore: resultStats.scoreRate
                    };
                    
                    // 첫 완료 체크
                    if (currentProgress.attempts === 0) {
                        newData.stats.completedLessons = (newData.stats.completedLessons || 0) + 1;
                    }

                    return newData;
                });
            };

            // 복습이 필요한 레슨 계산
            const getReviewableLessons = () => {
                const now = Date.now();
                return Object.keys(appData.lessonProgress).filter(id => {
                    const prog = appData.lessonProgress[id];
                    return prog.nextReview > 0 && prog.nextReview <= now;
                });
            };

            return (
                <div className="h-screen flex flex-col md:flex-row bg-[#312e2b] text-[#c3c2c1] overflow-hidden">
                    {/* 네비게이션 바 */}
                    <nav className="bg-[#262421] w-full md:w-20 lg:w-48 flex md:flex-col items-center py-2 md:py-6 border-b md:border-b-0 md:border-r border-[#403d39] z-20 flex-shrink-0">
                        <div className="text-[#81b64c] text-2xl md:text-3xl font-bold mb-0 md:mb-8 mx-4 md:mx-0 flex items-center gap-2 cursor-pointer" onClick={() => navigate('dashboard')}>
                            <i className="fa-solid fa-flask"></i>
                            <span className="hidden lg:block text-xl tracking-wide">Lab</span>
                        </div>
                        <div className="flex md:flex-col gap-6 md:gap-8 flex-1 justify-center md:justify-start w-full px-4 md:px-0">
                            <button onClick={() => navigate('dashboard')} className={`flex flex-col items-center transition-colors ${view === 'dashboard' ? 'text-white' : 'text-[#8c8a88] hover:text-white'}`}>
                                <i className="fa-solid fa-house text-xl mb-1"></i>
                                <span className="text-xs hidden lg:block font-medium">홈</span>
                            </button>
                            <button onClick={() => navigate('list')} className={`flex flex-col items-center transition-colors ${view === 'list' ? 'text-white' : 'text-[#8c8a88] hover:text-white'}`}>
                                <i className="fa-solid fa-book-open text-xl mb-1"></i>
                                <span className="text-xs hidden lg:block font-medium">학습/목록</span>
                            </button>
                            <button aria-label="설정" onClick={() => navigate('settings')} className={`flex flex-col items-center transition-colors ${view === 'settings' ? 'text-white' : 'text-[#8c8a88] hover:text-white'}`}>
                                <i className="fa-solid fa-gear text-xl mb-1"></i>
                                <span className="text-xs hidden lg:block font-medium">설정</span>
                            </button>
                        </div>
                    </nav>

                    {/* 메인 뷰 라우팅 */}
                    <main className="flex-1 overflow-y-auto w-full relative">
                        {view === 'dashboard' && <Dashboard navigate={navigate} appData={appData} reviewList={getReviewableLessons()} />}
                        {view === 'list' && <OpeningList navigate={navigate} appData={appData} />}
                        {view === 'settings' && <Settings appData={appData} updateSettings={updateSettings} resetProgress={resetProgress} />}
                        {view === 'lesson' && activeLesson && (
                            <LessonRunner lesson={activeLesson} onExit={() => navigate('list')} updateProgress={updateLessonProgress} settings={appData.settings} />
                        )}
                    </main>
                </div>
            );
        };

        const Settings = ({ appData, updateSettings, resetProgress }) => (
            <div className="p-4 md:p-8 max-w-2xl mx-auto">
                <h1 className="text-2xl font-bold text-white mb-6">학습 기록 · 설정</h1>
                <div className="bg-[#262421] border border-[#403d39] rounded-lg p-5 space-y-5">
                    <label className="flex justify-between gap-4 items-center cursor-pointer"><span><b className="text-white block">보드 좌표 표시</b><small>현재 보드 방향에 맞춰 좌표를 표시합니다.</small></span><input aria-label="보드 좌표 표시" type="checkbox" checked={appData.settings.showCoords !== false} onChange={e=>updateSettings({showCoords:e.target.checked})}/></label>
                    <label className="flex justify-between gap-4 items-center cursor-pointer"><span><b className="text-white block">애니메이션 줄이기</b><small>수 이동 애니메이션을 최소화합니다.</small></span><input aria-label="애니메이션 줄이기" type="checkbox" checked={!!appData.settings.reduceAnim} onChange={e=>updateSettings({reduceAnim:e.target.checked})}/></label>
                    <div className="border-t border-[#403d39] pt-5"><p className="text-sm mb-3">기록은 이 브라우저의 localStorage에 저장됩니다. GitHub Pages에서도 로그인 없이 유지되지만, 다른 기기·브라우저와는 동기화되지 않습니다.</p><button onClick={resetProgress} className="bg-red-900/60 hover:bg-red-800 text-white px-4 py-2 rounded font-bold">학습 기록 초기화</button></div>
                </div>
            </div>
        );

        const Dashboard = ({ navigate, appData, reviewList }) => {
            const totalLessons = LESSON_DATA.length;
            const completed = appData.stats.completedLessons || 0;
            const progressPct = Math.round((completed / totalLessons) * 100) || 0;
            const routeLevels = [
                { title: '초심자 스테이지', rating: '600~1000', desc: '기본 전개와 중앙 장악을 익힙니다.', lessons: [['l_ita_w', '이탈리안', '백·중앙'], ['l_ita_b', '이탈리안 방어', '흑·전개'], ['l_lon_w', '런던 시스템', '백·구조'], ['l_e5_b', '1...e5', '흑·중앙'], ['l_scotch_w', '스카치', '백·교환']] },
                { title: '기본 분기 스테이지', rating: '1000~1400', desc: '대표적인 중앙 구조와 방어를 배웁니다.', lessons: [['l_qg_w', '퀸즈 갬빗', '백·압박'], ['l_qg_b', '갬빗 거절', '흑·수비'], ['l_caro_b', '카로칸', '흑·견고'], ['l_fre_b', '프렌치', '흑·반격'], ['l_ruy_w', '루이 로페즈', '백·압박']] },
                { title: '구조와 반격 스테이지', rating: '1400~1800', desc: '불균형한 구조와 적극적인 반격을 연습합니다.', lessons: [['l_sic_b', '시칠리안', '흑·반격'], ['l_kid_b', '킹스 인디언', '흑·피앙케토']] }
            ];
            const routeComplete = (route) => route.lessons.every(([id]) => (appData.lessonProgress[id]?.attempts || 0) > 0);
            const activeRouteIndex = routeLevels.findIndex(route => !routeComplete(route));
            const isAllRoutesComplete = activeRouteIndex === -1;
            const activeRoute = routeLevels[isAllRoutesComplete ? routeLevels.length - 1 : activeRouteIndex];
            const activePath = activeRoute.lessons.map(([id, name, meta]) => ({ lesson: LESSON_DATA.find(l => l.id === id), name, meta }));

            return (
                <div className="p-4 md:p-8 max-w-4xl mx-auto w-full">
                    <h1 className="text-3xl font-bold text-white mb-6">환영합니다! 체스 오프닝 연구소입니다.</h1>
                    {Object.keys(appData.lessonProgress).length === 0 && <div className="bg-[#1a1918] border-l-4 border-[#81b64c] p-4 rounded mb-6 text-sm">먼저 백 오프닝 하나와 흑 대응 하나를 골라보세요. 긴 수순보다 처음 몇 수의 이유를 이해하는 것이 목표입니다.</div>}
                    
                    {/* 통계 요약 카드 */}
                    <div className="bg-[#262421] p-6 rounded-lg border border-[#403d39] mb-8 shadow-lg flex flex-col md:flex-row gap-6 items-center justify-between">
                        <div>
                            <p className="text-[#8c8a88] text-sm font-bold uppercase tracking-wider mb-1">나의 진도</p>

        const LessonRunner = ({ lesson, onExit, updateProgress, settings }) => {
            const [mode, setMode] = useState('learn'); // 'learn', 'train', 'result'
            const boardRef = useRef(null);
            const boardInstance = useRef(null);
            const chessEngine = useRef(new Chess());
            
            // 파싱된 레슨 데이터 (from, to, fen, 설명 포함 배열)
            const parsedMoves = useMemo(() => buildLessonMoves(lesson.moves, lesson.explanations, lesson.color), [lesson]);
            
            // 상태 관리
            const [currentMoveIdx, setCurrentMoveIdx] = useState(0); // 0은 시작(빈) 상태
            const [boardFen, setBoardFen] = useState('start');
            const [highlightSquares, setHighlightSquares] = useState(null);
            const [selectedSquare, setSelectedSquare] = useState(null);
            const [clickTargets, setClickTargets] = useState([]);
            const [isFlipped, setIsFlipped] = useState(false);
            
            // 훈련 관련 상태
            const [trainState, setTrainState] = useState('waiting_user'); // waiting_user, opponent_moving, error
            const [feedbackMsg, setFeedbackMsg] = useState('');
            const [hintLevel, setHintLevel] = useState(0);
            const [stats, setStats] = useState({ totalUserMoves: 0, firstTryCorrect: 0, hints: 0, currentMoveAttempts: 0 });

            // --- 클로저(Closure) 버그 방지용 최신 상태 컨테이너 ---
            // React의 useEffect 안에서만 생성되는 chessboard.js의 이벤트가 항상 최신 상태를 볼 수 있도록 합니다.
            const stateRef = useRef({});
            useEffect(() => {
                stateRef.current = { mode, trainState, currentMoveIdx, parsedMoves, hintLevel, stats, lessonColor: lesson.color };
            });

            // 상대편 기물 자동 움직임 트리거 (useRef로 담아 onDrop 안에서도 에러 없이 호출)
            const triggerOpponentMoveRef = useRef();
            const opponentTimerRef = useRef(null);
            const goToMoveRef = useRef(null);
            const processMoveRef = useRef(null);
            const squareClickRef = useRef(null);
            triggerOpponentMoveRef.current = (idx) => {
                window.clearTimeout(opponentTimerRef.current);
                opponentTimerRef.current = setTimeout(() => {
                    if (stateRef.current.mode !== 'train' || stateRef.current.trainState !== 'opponent_moving') return;
                    const moveData = stateRef.current.parsedMoves[idx];
                    if(!moveData) return;
                    chessEngine.current.move({from: moveData.from, to: moveData.to, promotion: 'q'});
                    playMoveSound();
                    setBoardFen(chessEngine.current.fen());
                    setHighlightSquares({from: moveData.from, to: moveData.to});
                    
                    const nextIdx = idx + 1;
                    setCurrentMoveIdx(nextIdx);
                    
                    if (nextIdx >= stateRef.current.parsedMoves.length) {
                        setTrainState('finished');
                        opponentTimerRef.current = window.setTimeout(() => setMode('result'), 1000);
                    } else {
                        setTrainState('waiting_user');
                        setFeedbackMsg('당신의 차례입니다.');
                    }
                }, 600); // 상대방 응수 지연 시간
            };

            processMoveRef.current = (source, target) => {
                const { mode, trainState, currentMoveIdx, parsedMoves, hintLevel, stats } = stateRef.current;
                const expectedMove = parsedMoves[currentMoveIdx];
                if (!expectedMove) return 'snapback';
                if (mode === 'learn') {
                    if (expectedMove.isOpponent) return 'snapback';
                    const move = chessEngine.current.move({ from: source, to: target, promotion: 'q' });
                    if (!move) return 'snapback';
                    chessEngine.current.undo();
                    if (move.from !== expectedMove.from || move.to !== expectedMove.to) return 'snapback';
                    goToMoveRef.current(currentMoveIdx + 1);
                    return;
                }
                if (mode !== 'train' || trainState !== 'waiting_user') return 'snapback';
                const move = chessEngine.current.move({ from: source, to: target, promotion: 'q' });
                if (!move) { setFeedbackMsg('불법 수입니다. 이 기물은 그 칸으로 이동할 수 없습니다.'); return 'snapback'; }
                if (move.from !== expectedMove.from || move.to !== expectedMove.to) {
                    chessEngine.current.undo();
                    setFeedbackMsg('가능한 수지만, 지금 연습하는 수순은 다른 수입니다.');
                    setStats(s => ({ ...s, currentMoveAttempts: s.currentMoveAttempts + 1 }));
                    setHintLevel(prev => Math.min(prev + 1, 3));
                    return 'snapback';
                }
                playMoveSound(); setFeedbackMsg('정답입니다!'); setBoardFen(chessEngine.current.fen()); setHighlightSquares({from: source, to: target});
                if (stats.currentMoveAttempts === 0 && hintLevel === 0) setStats(s => ({ ...s, firstTryCorrect: s.firstTryCorrect + 1 }));
                const nextIdx = currentMoveIdx + 1;
                setCurrentMoveIdx(nextIdx); setHintLevel(0); setStats(s => ({...s, currentMoveAttempts: 0}));
                if (nextIdx >= parsedMoves.length) {
                    window.clearTimeout(opponentTimerRef.current);
                    opponentTimerRef.current = window.setTimeout(() => { setTrainState('finished'); setMode('result'); }, 500);
                } else if (parsedMoves[nextIdx].isOpponent) { setTrainState('opponent_moving'); triggerOpponentMoveRef.current(nextIdx); }
                return;
            };

            squareClickRef.current = (square) => {
                const { mode, trainState, currentMoveIdx, parsedMoves, lessonColor } = stateRef.current;
                const expected = parsedMoves[currentMoveIdx];
                const canMove = mode === 'train' && trainState === 'waiting_user';
                if (!canMove) return;
                if (selectedSquare) {
                    if (selectedSquare === square) { setSelectedSquare(null); setClickTargets([]); return; }
                    processMoveRef.current(selectedSquare, square);
                    setSelectedSquare(null); setClickTargets([]);
                    return;
                }
                const piece = chessEngine.current.get(square);
                if (!piece || piece.color !== lessonColor) return;
                const targets = chessEngine.current.moves({square, verbose:true}).map(m => ({to:m.to, capture:!!m.captured}));
                setSelectedSquare(square); setClickTargets(targets);
            };

            // --- 체스보드 초기화 (useEffect) ---
            useEffect(() => {
                const config = {
                    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                    position: 'start',
                    orientation: (lesson.color === 'w') !== isFlipped ? 'white' : 'black',
                    showNotation: settings.showCoords !== false,
                    draggable: false,
                    onDragStart: (source, piece) => {
                        const { mode, trainState, currentMoveIdx, parsedMoves, lessonColor } = stateRef.current;
                        const isLearnUserTurn = mode === 'learn' && currentMoveIdx < parsedMoves.length && !parsedMoves[currentMoveIdx].isOpponent;
                        
                        // 학습 모드는 한 수씩 보고 설명을 확인하는 관찰 전용 흐름입니다.
                        if (mode === 'learn') {
                            return false;
                        }

                        // 훈련 모드일 때
                        if (mode !== 'train' || trainState !== 'waiting_user') return false;
                        if ((lessonColor === 'w' && piece.search(/^b/) !== -1) ||
                            (lessonColor === 'b' && piece.search(/^w/) !== -1)) {
                            return false;
                        }
                        return true;
                    },
                    onDrop: (source, target) => processMoveRef.current(source, target),
                    moveSpeed: settings.reduceAnim ? 'fast' : 'normal',
                    snapbackSpeed: settings.reduceAnim ? 50 : 250
                };
                
                if (boardRef.current && !boardInstance.current) {
                    boardInstance.current = Chessboard(boardRef.current, config);
                    // chessboard.js의 드래그 처리와 무관하게, 캡처 단계에서 마우스 클릭을 받습니다.
                    const boardClickHandler = (event) => {
                        const square = event.target.closest && event.target.closest('.square-55d63');
                        if (square && boardRef.current && boardRef.current.contains(square)) {
                            squareClickRef.current(square.getAttribute('data-square'));
                        }
                    };
                    boardRef.current.addEventListener('mousedown', boardClickHandler, true);
                    
                    setTimeout(() => {
                        if (boardInstance.current) {
                            boardInstance.current.resize();
                        }
                    }, 50);

                    const resizeBoard = () => boardInstance.current && boardInstance.current.resize();
                    window.addEventListener('resize', resizeBoard);
                    return () => {
                        window.removeEventListener('resize', resizeBoard);
                        if (boardRef.current) boardRef.current.removeEventListener('mousedown', boardClickHandler, true);
                        window.clearTimeout(opponentTimerRef.current);
                        if(boardInstance.current) {
                            boardInstance.current.destroy();
                            boardInstance.current = null;
                        }
                    };
                }
            }, [lesson.color, settings.showCoords, isFlipped]);

            // FEN 동기화 및 하이라이트 처리
            useEffect(() => {
                if (boardInstance.current) {
                    boardInstance.current.position(boardFen, !settings.reduceAnim);
                    
                    $('#board-container .square-55d63').removeClass('highlight1-32417 highlight2-9c5d2');
                    if (highlightSquares) {
                        $(`#board-container .square-${highlightSquares.from}`).addClass('highlight1-32417');
                        $(`#board-container .square-${highlightSquares.to}`).addClass('highlight2-9c5d2');
                    }
                    $('#board-container .square-55d63').removeClass('selected-square legal-target legal-capture');
                    if (selectedSquare) $(`#board-container .square-${selectedSquare}`).addClass('selected-square');
                    clickTargets.forEach(t => $(`#board-container .square-${t.to}`).addClass(t.capture ? 'legal-capture' : 'legal-target'));
                }
            }, [boardFen, highlightSquares, selectedSquare, clickTargets, settings.reduceAnim]);

            // --- 모드 전환 초기화 ---
            useEffect(() => {
                chessEngine.current.reset();
                setCurrentMoveIdx(0);
                setBoardFen('start');
                setHighlightSquares(null);
                setSelectedSquare(null); setClickTargets([]); window.clearTimeout(opponentTimerRef.current);
                setFeedbackMsg('');
                
                if (mode === 'train') {
                    setStats({ totalUserMoves: parsedMoves.filter(m => !m.isOpponent).length, firstTryCorrect: 0, hints: 0, currentMoveAttempts: 0 });
                    setHintLevel(0);
                    // 첫 수가 상대 수라면 즉시 실행
                    if (parsedMoves.length > 0 && parsedMoves[0].isOpponent) {
                        setTrainState('opponent_moving');
                        triggerOpponentMoveRef.current(0);
                    } else {
                        setTrainState('waiting_user');
                    }
                }
            }, [mode, lesson]);
            
            // --- 힌트 사용 ---
            const useHint = (level) => {
                setHintLevel(level);
                setStats(s => ({...s, hints: s.hints + 1}));
                if(level === 3) {
                    // 정답 화살표시(보드 하이라이트)
                    const expected = parsedMoves[currentMoveIdx];
                    setHighlightSquares({from: expected.from, to: expected.to});
                }
            };

            const skipToAnswer = () => {
                const expected = parsedMoves[currentMoveIdx];
                chessEngine.current.move({from: expected.from, to: expected.to, promotion: 'q'});
                playMoveSound();
                setBoardFen(chessEngine.current.fen());
                setHighlightSquares({from: expected.from, to: expected.to});
                
                setStats(s => ({...s, hints: s.hints + 1, currentMoveAttempts: 0}));
                setHintLevel(0);
                
                const nextIdx = currentMoveIdx + 1;
                setCurrentMoveIdx(nextIdx);

                if (nextIdx >= parsedMoves.length) {
                    setTrainState('finished');
                    window.setTimeout(() => setMode('result'), 500);
                } else {
                    if (parsedMoves[nextIdx].isOpponent) {
                        setTrainState('opponent_moving');
                        triggerOpponentMoveRef.current(nextIdx);
                    } else {
                        setTrainState('waiting_user');
                    }
                }
            };


            const goToMove = (index) => {
                if(mode !== 'learn') return;
                
                chessEngine.current.reset();
                for (let i = 0; i < index; i++) {
                    const m = parsedMoves[i];
                    chessEngine.current.move({from: m.from, to: m.to, promotion: 'q'});
                }
                
                setCurrentMoveIdx(index);
                setBoardFen(index === 0 ? 'start' : chessEngine.current.fen());
                
                if (index > 0) {
                    const lastMove = parsedMoves[index - 1];
                    setHighlightSquares({from: lastMove.from, to: lastMove.to});
                    playMoveSound();
                } else {
                    setHighlightSquares(null);
                }
            };
            goToMoveRef.current = goToMove;

            const learnNext = () => { if (currentMoveIdx < parsedMoves.length) goToMove(currentMoveIdx + 1); };
            const learnPrev = () => { if (currentMoveIdx > 0) goToMove(currentMoveIdx - 1); };
            const learnStart = () => { goToMove(0); };

            // 결과 저장 로직 트리거
            useEffect(() => {
                if (mode === 'result') {
                    const isPerfect = stats.firstTryCorrect === stats.totalUserMoves && stats.hints === 0;
                    const scoreRate = stats.totalUserMoves > 0 ? (stats.firstTryCorrect / stats.totalUserMoves) : 0;
                    updateProgress(lesson.id, { isPerfect, scoreRate });
                }
            }, [mode]);

            // 설명 패널 추출
            const currentDesc = currentMoveIdx > 0 ? parsedMoves[currentMoveIdx - 1].explanation : null;
            const isNextUserTurn = currentMoveIdx < parsedMoves.length && !parsedMoves[currentMoveIdx].isOpponent;

            return (
                <div className="flex flex-col md:flex-row min-h-full w-full p-2 md:p-4 gap-3 md:gap-4 bg-[#312e2b]">
                    
                    {/* 상단/좌측: 체스판 영역 */}
                    <div className="w-full md:w-3/5 max-w-[680px] flex flex-col mx-auto flex-shrink-0">
                        {/* 상단 툴바 (뒤로가기 등) */}
                        <div className="flex justify-between items-center mb-2">
                            <button onClick={onExit} className="text-[#8c8a88] hover:text-white flex items-center gap-2">
                                <i className="fa-solid fa-arrow-left"></i> 목록으로
                            </button>
                            <div className="flex items-center gap-2"><button aria-label="보드 뒤집기" title="보드 뒤집기" onClick={()=>setIsFlipped(v=>!v)} className="btn-dark px-3 py-1 rounded"><i className="fa-solid fa-rotate"></i></button><span className="text-white font-bold text-sm bg-[#262421] px-3 py-1 rounded border border-[#403d39]">{lesson.title}</span></div>
                        </div>

                        {/* 플레이어 라벨 (상단: 상대방) */}
                        <div className="flex items-center gap-3 mb-2 px-2 text-sm font-semibold text-[#8c8a88]">
                            <div className="w-8 h-8 bg-[#1a1918] rounded flex items-center justify-center border border-[#403d39]">
                                <i className={`fa-solid fa-robot ${lesson.color==='w' ? 'text-black' : 'text-white'}`}></i>
                            </div>
                            <span>상대방 ({lesson.color==='w' ? '흑' : '백'})</span>
                            {mode==='train' && trainState==='opponent_moving' && <span className="text-xs bg-yellow-500 text-black px-2 py-0.5 rounded animate-pulse">생각 중...</span>}
                        </div>
                        {mode === 'learn' && <section className="mb-2 rounded-xl border border-[#4d6250] bg-[#1a2529] px-3 py-2.5 shadow-lg" aria-live="polite"><div className="flex items-center gap-2"><i className="fa-solid fa-lightbulb text-[#a3d160]"></i><p className="text-xs md:text-sm text-white leading-relaxed">{currentMoveIdx === 0 ? '첫 수를 보면서 이 오프닝의 핵심을 하나씩 익혀볼까요?' : (currentDesc ? `${currentDesc.short} — ${currentDesc.purpose}` : '상대방의 자연스러운 응수입니다.')}</p></div></section>}
                        {mode === 'train' && <section className={`mb-2 rounded-xl border px-3 py-2.5 ${feedbackMsg.includes('정답') ? 'border-green-800 bg-green-900/20 text-green-300' : (feedbackMsg.includes('다른 수') || feedbackMsg.includes('불법') ? 'border-red-800 bg-red-900/20 text-red-200' : 'border-[#403d39] bg-[#1a1918] text-white')}`} aria-live="polite"><p className="text-sm font-bold">{feedbackMsg || '기물을 클릭한 뒤, 표시된 목적지 칸을 클릭하세요.'}</p></section>}

                        {/* 실제 체스판 렌더링 컨테이너 */}
                        <div id="board-container" aria-label="체스판: 기물을 선택한 뒤 표시된 칸을 선택해 이동" className="relative w-full aspect-square shadow-2xl rounded-sm overflow-hidden border-4 border-[#262421]">
                            <div ref={boardRef} style={{width: '100%', height: '100%'}}></div>
                            {mode === 'result' && (
                                <section className="absolute inset-4 z-10 flex items-center justify-center bg-[#10191c]/75 backdrop-blur-sm">
                                    <div className="w-full max-w-sm rounded-2xl border border-[#59725b] bg-[#1a2529] p-5 text-center shadow-2xl animate-pop">
                                        <i className="fa-solid fa-trophy text-4xl text-yellow-500 mb-3"></i><h2 className="text-xl font-bold text-white">훈련 완료!</h2>
                                        <p className="text-sm text-[#d8e1df] mt-2">첫 시도 정답률 {Math.round((stats.firstTryCorrect/Math.max(1,stats.totalUserMoves))*100)}% · 힌트 {stats.hints}회</p>
                                        <div className="grid grid-cols-2 gap-2 mt-5"><button onClick={() => setMode('train')} className="btn-dark py-2 rounded font-bold">다시 훈련</button><button onClick={onExit} className="btn-green py-2 rounded font-bold">목록으로</button></div>
                                    </div>
                                </section>
                            )}
                        </div>

                        {/* 플레이어 라벨 (하단: 사용자) */}
                        <div className="flex items-center gap-3 mt-2 px-2 text-sm font-semibold text-white">
                            <div className={`w-8 h-8 rounded flex items-center justify-center border border-[#403d39] ${lesson.color==='w' ? 'bg-gray-100' : 'bg-gray-800'}`}>
                                <i className={`fa-solid fa-user ${lesson.color==='w' ? 'text-gray-800' : 'text-gray-100'}`}></i>
                            </div>
                            <span>당신 ({lesson.color==='w' ? '백' : '흑'})</span>
                            {mode==='train' && trainState==='waiting_user' && <span className="text-xs bg-[#81b64c] text-white px-2 py-0.5 rounded animate-pop">내 차례</span>}
                        </div>
                        {mode === 'learn' && <div className="mt-3 flex gap-2"><button onClick={learnStart} disabled={currentMoveIdx===0} className="btn-dark h-11 px-3 rounded text-sm"><i className="fa-solid fa-backward-fast"></i></button><button onClick={learnPrev} disabled={currentMoveIdx===0} className="btn-dark h-11 px-3 rounded text-sm"><i className="fa-solid fa-backward-step"></i></button>{currentMoveIdx < parsedMoves.length ? <button onClick={learnNext} className="btn-green flex-1 h-11 rounded font-bold">{currentMoveIdx === 0 ? '첫 수 보기' : '다음 수'} <i className="fa-solid fa-arrow-right ml-2"></i></button> : <button onClick={() => setMode('train')} className="btn-green flex-1 h-11 rounded font-bold"><i className="fa-solid fa-check mr-2"></i>학습 완료 · 훈련 시작</button>}</div>}
                        {mode === 'train' && <div className="mt-3 grid grid-cols-2 gap-2"><button onClick={()=>useHint(hintLevel+1)} disabled={trainState!=='waiting_user' || hintLevel>=3} className="btn-dark h-11 rounded text-sm font-bold">힌트 보기</button><button onClick={skipToAnswer} disabled={trainState!=='waiting_user'} className="bg-red-900/50 hover:bg-red-800 text-red-200 h-11 rounded text-sm font-bold">정답 보고 넘기기</button></div>}
                    </div>

                    {/* 하단/우측: 정보 및 컨트롤 패널 */}
                    <div className="flex-1 min-w-0 bg-[#262421] rounded-lg shadow-xl flex flex-col h-auto min-h-0 border border-[#403d39] self-start md:max-h-[calc(100vh-2rem)] md:overflow-y-auto">
                        
                        {/* 탭 헤더 */}
                        <div className="flex border-b border-[#403d39]">
                            <button className={`flex-1 py-3 text-sm font-bold transition-colors ${mode==='learn' ? 'text-white border-b-2 border-[#81b64c]' : 'text-[#8c8a88]'}`} onClick={() => mode!=='result' && setMode('learn')}>
                                <i className="fa-solid fa-book-open mr-2"></i> 학습 모드
                            </button>
                            <button className={`flex-1 py-3 text-sm font-bold transition-colors ${mode==='train' ? 'text-white border-b-2 border-yellow-500' : 'text-[#8c8a88]'}`} onClick={() => mode!=='result' && setMode('train')}>
                                <i className="fa-solid fa-dumbbell mr-2"></i> 훈련 모드
                            </button>
                        </div>

                        {/* --- 학습 모드 컨텐츠 --- */}
                        {mode === 'learn' && (
                            <div className="p-4">
                                <p className="text-sm text-[#c3c2c1]">수의 이유와 계속하기 버튼은 체스판 위 카드에서 진행합니다.</p>
                                <p className="text-xs text-[#8c8a88] mt-2">필요하면 이전 수만 되돌려 다시 확인할 수 있습니다.</p>
                                <div className="flex gap-2 mt-4"><button onClick={learnStart} disabled={currentMoveIdx===0} className="btn-dark px-3 h-10 rounded"><i className="fa-solid fa-backward-fast"></i> 처음</button><button onClick={learnPrev} disabled={currentMoveIdx===0} className="btn-dark px-3 h-10 rounded"><i className="fa-solid fa-backward-step"></i> 이전 수</button></div>
                            </div>
                        )}

                        {/* --- 훈련 모드 컨텐츠 --- */}
                        {mode === 'train' && (
                            <div className="p-4">
                                <p className="text-sm text-[#c3c2c1]">훈련 조작과 피드백은 체스판 바로 위·아래에서 진행합니다.</p>
                                {trainState === 'waiting_user' && hintLevel > 0 && currentMoveIdx < parsedMoves.length && (
                                    <div className="bg-[#1a1918] p-3 rounded border border-[#403d39] mt-3 text-sm animate-pop">
                                        <p className="text-[#8c8a88] font-bold mb-2">💡 힌트</p>
                                        {hintLevel >= 1 && parsedMoves[currentMoveIdx].explanation && <p className="mb-1 text-white">목적: {parsedMoves[currentMoveIdx].explanation.purpose}</p>}
                                        {hintLevel >= 2 && <p className="mb-1 text-blue-300">어떤 칸으로 갈지 집중해보세요.</p>}
                                        {hintLevel >= 3 && <p className="mb-1 text-yellow-400 font-mono">기보: {parsedMoves[currentMoveIdx].san}</p>}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* --- 결과 화면 --- */}
                        {mode === 'result' && (
                            <div className="p-5 text-center text-sm text-[#8c8a88]">훈련 결과와 다음 행동은 체스판 위 완료 팝업에서 확인하세요.</div>
                        )}
                    </div>
                </div>
            );
        };

        // React 앱 렌더링
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
